apply plugin: 'com.android.application'

def readReleaseSigningIdentity() {
    def envStoreFile = System.getenv("ANDROID_KEYSTORE_PATH")
    def envStorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
    def envKeyAlias = System.getenv("ANDROID_KEY_ALIAS")
    def envKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")

    if (envStoreFile && envStorePassword && envKeyAlias && envKeyPassword) {
        return [
            storeFile    : envStoreFile,
            storePassword: envStorePassword,
            keyAlias     : envKeyAlias,
            keyPassword  : envKeyPassword
        ]
    }

    def propsFile = rootProject.file("keystore.properties")
    if (propsFile.exists()) {
        def props = new Properties()
        propsFile.withInputStream { stream -> props.load(stream) }
        def storeFile = props.getProperty("storeFile")
        def storePassword = props.getProperty("storePassword")
        def keyAlias = props.getProperty("keyAlias")
        def keyPassword = props.getProperty("keyPassword")
        if (storeFile && storePassword && keyAlias && keyPassword) {
            return [
                storeFile    : storeFile,
                storePassword: storePassword,
                keyAlias     : keyAlias,
                keyPassword  : keyPassword
            ]
        }
    }

    return null
}

def isDebugKeystorePath(pathString) {
    if (pathString == null) {
        return false
    }
    def normalized = pathString.replace("\\", "/").toLowerCase()
    return normalized.endsWith("/debug.keystore") || normalized == "debug.keystore"
}

def releaseSigningIdentity = readReleaseSigningIdentity()
if (releaseSigningIdentity != null && isDebugKeystorePath(releaseSigningIdentity.storeFile)) {
    logger.warn("Release signing identity rejected: debug.keystore cannot be used as a production/distribution key.")
    releaseSigningIdentity = null
}

android {
    namespace "com.innovativenovels.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.innovativenovels.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    if (releaseSigningIdentity != null) {
        signingConfigs {
            release {
                def storeFileRef = new File(releaseSigningIdentity.storeFile)
                if (!storeFileRef.isAbsolute()) {
                    storeFileRef = rootProject.file(releaseSigningIdentity.storeFile)
                }
                storeFile storeFileRef
                storePassword releaseSigningIdentity.storePassword
                keyAlias releaseSigningIdentity.keyAlias
                keyPassword releaseSigningIdentity.keyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (releaseSigningIdentity != null) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    androidTestImplementation "androidx.test.uiautomator:uiautomator:$androidxUiautomatorVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
