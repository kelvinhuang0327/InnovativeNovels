apply plugin: 'com.android.application'

def androidReleaseSigningValues = [
    'ANDROID_KEYSTORE_PATH': System.getenv('ANDROID_KEYSTORE_PATH'),
    'ANDROID_KEYSTORE_PASSWORD': System.getenv('ANDROID_KEYSTORE_PASSWORD'),
    'ANDROID_KEY_ALIAS': System.getenv('ANDROID_KEY_ALIAS'),
    'ANDROID_KEY_PASSWORD': System.getenv('ANDROID_KEY_PASSWORD')
]
def hasAnyAndroidReleaseSigningInput = androidReleaseSigningValues.values().any { value -> value != null && !value.isEmpty() }
def hasCompleteAndroidReleaseSigningInput = androidReleaseSigningValues.values().every { value -> value != null && !value.isEmpty() }

if (hasAnyAndroidReleaseSigningInput && !hasCompleteAndroidReleaseSigningInput) {
    throw new GradleException('Android release signing requires ANDROID_KEYSTORE_PATH, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD together.')
}

def androidReleaseKeystorePath = hasCompleteAndroidReleaseSigningInput
    ? androidReleaseSigningValues['ANDROID_KEYSTORE_PATH']
    : null

if (hasCompleteAndroidReleaseSigningInput && !new File(androidReleaseKeystorePath).isAbsolute()) {
    throw new GradleException('ANDROID_KEYSTORE_PATH must be an absolute path outside the repository root.')
}

def androidReleaseKeystoreFile = hasCompleteAndroidReleaseSigningInput
    ? project.file(androidReleaseKeystorePath)
    : null

if (hasCompleteAndroidReleaseSigningInput && !androidReleaseKeystoreFile.isFile()) {
    throw new GradleException('ANDROID_KEYSTORE_PATH must point to an existing Android release keystore.')
}

if (hasCompleteAndroidReleaseSigningInput) {
    def canonicalRepositoryRoot = project.rootProject.projectDir.parentFile.canonicalPath
    def canonicalKeystorePath = androidReleaseKeystoreFile.canonicalPath
    def repositoryRootPrefix = canonicalRepositoryRoot.endsWith(File.separator)
        ? canonicalRepositoryRoot
        : "${canonicalRepositoryRoot}${File.separator}"
    if (canonicalKeystorePath == canonicalRepositoryRoot || canonicalKeystorePath.startsWith(repositoryRootPrefix)) {
        throw new GradleException('ANDROID_KEYSTORE_PATH must point outside the repository root so private material stays untracked.')
    }

    def defaultDebugKeystoreFile = new File(System.getProperty('user.home'), '.android/debug.keystore')
    def isDebugKeystore = androidReleaseKeystoreFile.name.equalsIgnoreCase('debug.keystore')
        || androidReleaseKeystoreFile.canonicalPath == defaultDebugKeystoreFile.canonicalPath
    if (isDebugKeystore) {
        throw new GradleException('Refusing to use the Android debug keystore for release signing.')
    }
}

android {
    namespace "com.innovativenovels.app"
    compileSdk rootProject.ext.compileSdkVersion
    if (hasCompleteAndroidReleaseSigningInput) {
        signingConfigs {
            release {
                storeFile androidReleaseKeystoreFile
                storePassword androidReleaseSigningValues['ANDROID_KEYSTORE_PASSWORD']
                keyAlias androidReleaseSigningValues['ANDROID_KEY_ALIAS']
                keyPassword androidReleaseSigningValues['ANDROID_KEY_PASSWORD']
            }
        }
    }
    defaultConfig {
        applicationId "com.innovativenovels.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasCompleteAndroidReleaseSigningInput) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    androidTestImplementation "androidx.test.uiautomator:uiautomator:$androidxUiautomatorVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
