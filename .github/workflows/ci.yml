name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test -- --run

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Copy Capacitor web assets
        run: npx --no-install cap copy ios && npx --no-install cap copy android

      - name: Verify wrapper
        run: npm run verify:wrapper
